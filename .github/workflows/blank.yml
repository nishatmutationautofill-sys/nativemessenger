name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: কোড চেকআউট
        uses: actions/checkout@v4

      - name: JDK 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK সেটআপ
        uses: android-actions/setup-android@v3

      - name: SDK প্যাকেজ ইনস্টল
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0"

      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Debug APK বিল্ড
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: gradle assembleDebug --console=plain --no-daemon 2>&1 | tee build.log

      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: ফেল করলে লগ আপলোড
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            app/build/reports/**
